{% extends 'base.html' %}

{% block body %}
  <h1 class="text-3xl font-bold text-blue-900 mb-6">The Creatives</h1>

  {% if posts %}
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      {% for post in posts %}
        <div class="bg-white shadow-md rounded-xl p-6 hover:shadow-lg transition">
          <h2 class="text-xl font-semibold text-gray-800">{{ post.title }}</h2>
          <p class="text-gray-700 mt-2">{{ post.content }}</p>
          <p class="text-sm text-gray-500 mt-4">Posted on {{ post.date_created.strftime('%Y-%m-%d') }}</p>
        </div>
      {% endfor %}
    </div>
  {% else %}
    <p class="text-gray-600">No posts available at the moment. Check back soon!</p>
  {% endif %}
{% endblock %}
